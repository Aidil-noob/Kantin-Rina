<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layar Antrean · Kantin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="screen-page">
  <div class="screen-wrap">
    <header class="screen-head">
      <div class="screen-brand">
        <span class="brand-mark">R</span>
        <div>
          <h1 id="store-name">Warung Bu Rina</h1>
          <p id="queue-name">Antrean Kantin</p>
        </div>
      </div>
      <div class="screen-clock" id="clock">--:--</div>
    </header>

    <main class="screen-main">
      <section class="screen-current">
        <div class="screen-label">Nomor Dipanggil</div>
        <div class="screen-number idle" id="screen-number">—</div>
        <p class="screen-hint" id="screen-hint">Silakan menunggu panggilan</p>
      </section>

      <aside class="screen-side">
        <h2>Menunggu</h2>
        <div class="screen-waiting" id="screen-waiting">
          <p class="screen-empty">Belum ada antrean menunggu.</p>
        </div>
        <div class="screen-foot">
          <span id="screen-counts">0 menunggu · 0 selesai</span>
        </div>
      </aside>
    </main>

    <footer class="screen-foot">
      <span>Nomor baru diambil di kasir/kantin</span>
      <div class="link-row">
        <button class="sound-toggle" type="button" id="sound-toggle">Suara: Aktif</button>
        <button class="sound-toggle" type="button" id="fullscreen">Layar Penuh</button>
        <a class="sound-toggle screen-link" href="/antrean">Operator</a>
      </div>
    </footer>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layar.js"></script>
</body>
</html>
